[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "launchpad-hello-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["devmrko-python-foundation==0.1.2", "oci==2.188.0"]

[tool.setuptools]
py-modules = ["agent", "hello_web", "hello_telemetry"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]
