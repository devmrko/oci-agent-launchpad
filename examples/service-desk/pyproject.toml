[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "launchpad-service-desk"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = ["devmrko-python-foundation==0.1.2"]

[project.optional-dependencies]
oci = ["oci==2.188.0"]

memory = ["oracleagentmemory==26.8.0", "oci==2.188.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.setuptools.packages.find]
include = ["service_desk*"]
