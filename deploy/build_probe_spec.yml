version: 0.1
component: build
timeoutInSeconds: 600
shell: bash
failImmediatelyOnError: true
steps:
  - type: Command
    name: Inspect actual runner storage and limits
    command: |
      set -euo pipefail
      cd "${OCI_PRIMARY_SOURCE_DIR}"
      python3 deploy/probe_build_runner.py | tee runner-capacity.json
outputArtifacts:
  - name: runner-capacity
    type: BINARY
    location: runner-capacity.json
